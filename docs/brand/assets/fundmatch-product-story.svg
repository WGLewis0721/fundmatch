<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">FundMatch product story</title>
  <desc id="desc">A clean diagram showing founders, FundMatch, and investors connected through profile standardization, thesis fit, and explainable matching.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f3"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24272b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="44" fill="url(#paper)"/>
  <circle cx="1190" cy="120" r="170" fill="#c6efde" opacity="0.65"/>
  <circle cx="210" cy="650" r="210" fill="#9caafa" opacity="0.22"/>
  <text x="72" y="92" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-2">FundMatch</text>
  <text x="74" y="132" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Great companies. Right investors.</text>

  <g filter="url(#shadow)">
    <rect x="74" y="220" width="310" height="330" rx="34" fill="#ffffff" stroke="#e5e4df"/>
    <text x="112" y="278" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="750">Founder</text>
    <text x="112" y="320" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Tells the story once</text>
    <rect x="112" y="365" width="220" height="38" rx="19" fill="#c6efde"/>
    <text x="132" y="390" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Company profile</text>
    <rect x="112" y="420" width="184" height="38" rx="19" fill="#f8f7f3" stroke="#e5e4df"/>
    <text x="132" y="445" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Deck + metrics</text>
    <rect x="112" y="475" width="230" height="38" rx="19" fill="#f8f7f3" stroke="#e5e4df"/>
    <text x="132" y="500" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Readiness gaps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="168" width="400" height="440" rx="44" fill="#24272b"/>
    <text x="548" y="238" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">FundMatch Engine</text>
    <text x="548" y="282" fill="#c6efde" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">AI-assisted, human-reviewed</text>
    <g>
      <rect x="548" y="330" width="304" height="52" rx="26" fill="#ffffff" opacity="0.1"/>
      <text x="574" y="363" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Standardize profile</text>
      <rect x="548" y="400" width="304" height="52" rx="26" fill="#ffffff" opacity="0.1"/>
      <text x="574" y="433" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Infer thesis fit</text>
      <rect x="548" y="470" width="304" height="52" rx="26" fill="#ffffff" opacity="0.1"/>
      <text x="574" y="503" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Explain the match</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1016" y="220" width="310" height="330" rx="34" fill="#ffffff" stroke="#e5e4df"/>
    <text x="1054" y="278" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="750">Investor</text>
    <text x="1054" y="320" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Finds what fits</text>
    <rect x="1054" y="365" width="116" height="116" rx="28" fill="#9caafa" opacity="0.88"/>
    <text x="1082" y="430" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="850">94%</text>
    <text x="1086" y="458" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">FIT</text>
    <rect x="1190" y="365" width="88" height="34" rx="17" fill="#f8f7f3" stroke="#e5e4df"/>
    <text x="1214" y="387" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Save</text>
    <rect x="1190" y="415" width="112" height="34" rx="17" fill="#c6efde"/>
    <text x="1210" y="437" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Interested</text>
  </g>

  <path d="M405 384 C455 384 455 384 500 384" fill="none" stroke="#9caafa" stroke-width="8" stroke-linecap="round"/>
  <path d="M900 384 C956 384 956 384 1000 384" fill="none" stroke="#c6efde" stroke-width="8" stroke-linecap="round"/>
  <text x="480" y="680" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Cleaner profiles → clearer fit → better capital conversations</text>
</svg>
