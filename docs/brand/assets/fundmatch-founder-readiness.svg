<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">FundMatch founder readiness</title>
  <desc id="desc">A dashboard-style graphic showing founder readiness checks, missing materials, and a standardized investor packet.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24272b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="44" fill="#f8f7f3"/>
  <text x="76" y="98" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="850" letter-spacing="-2">Founder Readiness MVP</text>
  <text x="78" y="138" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Help a startup get its ducks in a row before fundraising outreach.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="210" width="570" height="420" rx="36" fill="#ffffff" stroke="#e5e4df"/>
    <text x="118" y="268" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Dippi readiness</text>
    <text x="118" y="302" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Seed raise packet</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="118" y="348" width="486" height="54" rx="20" fill="#c6efde"/>
      <text x="150" y="382" fill="#24272b">✓ Company profile complete</text>
      <rect x="118" y="418" width="486" height="54" rx="20" fill="#c6efde" opacity="0.8"/>
      <text x="150" y="452" fill="#24272b">✓ Traction summary added</text>
      <rect x="118" y="488" width="486" height="54" rx="20" fill="#fff" stroke="#e5e4df"/>
      <text x="150" y="522" fill="#24272b">○ Financials need review</text>
      <rect x="118" y="558" width="486" height="54" rx="20" fill="#fff" stroke="#e5e4df"/>
      <text x="150" y="592" fill="#24272b">○ Use of funds missing</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="210" width="564" height="420" rx="36" fill="#24272b"/>
    <text x="806" y="268" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="850">Standardized investor packet</text>
    <text x="806" y="306" fill="#c6efde" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Clean format, visible sources, human-reviewed AI.</text>

    <rect x="806" y="356" width="206" height="190" rx="28" fill="#f8f7f3"/>
    <text x="840" y="414" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="850">82%</text>
    <text x="840" y="452" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">READY</text>
    <rect x="840" y="484" width="124" height="30" rx="15" fill="#9caafa"/>
    <text x="864" y="504" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Seed</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
      <rect x="1050" y="356" width="224" height="44" rx="18" fill="#ffffff" opacity="0.1"/>
      <text x="1072" y="383" fill="#ffffff">Profile summary</text>
      <rect x="1050" y="416" width="224" height="44" rx="18" fill="#ffffff" opacity="0.1"/>
      <text x="1072" y="443" fill="#ffffff">Traction + metrics</text>
      <rect x="1050" y="476" width="224" height="44" rx="18" fill="#ffffff" opacity="0.1"/>
      <text x="1072" y="503" fill="#ffffff">Risks + questions</text>
      <rect x="1050" y="536" width="224" height="44" rx="18" fill="#ffffff" opacity="0.1"/>
      <text x="1072" y="563" fill="#ffffff">Source trail</text>
    </g>
  </g>

  <path d="M666 420 C704 420 720 420 744 420" fill="none" stroke="#9caafa" stroke-width="10" stroke-linecap="round"/>
  <path d="M730 404 L750 420 L730 436" fill="none" stroke="#9caafa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="338" y="704" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">Readiness is the first single-sided wedge before the full marketplace.</text>
</svg>
