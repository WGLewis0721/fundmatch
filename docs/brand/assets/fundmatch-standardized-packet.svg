<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">FundMatch standardized packet</title>
  <desc id="desc">A clean investor packet graphic showing a standardized company profile, metrics, source labels, risks, and open questions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24272b" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="44" fill="#f8f7f3"/>
  <circle cx="250" cy="120" r="150" fill="#c6efde" opacity="0.6"/>
  <circle cx="1120" cy="650" r="210" fill="#9caafa" opacity="0.22"/>

  <text x="76" y="98" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="850" letter-spacing="-2">Standardized FundMatch Packet</text>
  <text x="78" y="138" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">No matter how messy the original deck is, investors get a clean consistent profile.</text>

  <g filter="url(#shadow)">
    <rect x="150" y="200" width="1100" height="470" rx="40" fill="#ffffff" stroke="#e5e4df"/>
    <rect x="150" y="200" width="1100" height="96" rx="40" fill="#24272b"/>
    <text x="204" y="260" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="850">Dippi</text>
    <text x="334" y="260" fill="#c6efde" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750">Seed · Consumer delivery · Marketplace</text>
    <rect x="1058" y="228" width="132" height="40" rx="20" fill="#9caafa"/>
    <text x="1090" y="253" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="850">94% fit</text>

    <text x="204" y="360" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="850">Company summary</text>
    <text x="204" y="398" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">On-demand liquor delivery connecting local stores and consumers.</text>
    <rect x="204" y="424" width="138" height="32" rx="16" fill="#f8f7f3" stroke="#e5e4df"/>
    <text x="228" y="446" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Source: deck</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect x="204" y="496" width="166" height="92" rx="24" fill="#c6efde"/>
      <text x="232" y="536" fill="#24272b" font-size="24" font-weight="850">$1.8M</text>
      <text x="232" y="566" fill="#24272b" font-size="13" font-weight="800">ARR</text>
      <rect x="392" y="496" width="166" height="92" rx="24" fill="#f8f7f3" stroke="#e5e4df"/>
      <text x="420" y="536" fill="#24272b" font-size="24" font-weight="850">140%</text>
      <text x="420" y="566" fill="#727579" font-size="13" font-weight="800">YOY growth</text>
      <rect x="580" y="496" width="166" height="92" rx="24" fill="#f8f7f3" stroke="#e5e4df"/>
      <text x="608" y="536" fill="#24272b" font-size="24" font-weight="850">$3.5M</text>
      <text x="608" y="566" fill="#727579" font-size="13" font-weight="800">raise</text>
    </g>

    <text x="826" y="360" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="850">Risks + questions</text>
    <text x="826" y="400" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">• Unit economics by market</text>
    <text x="826" y="434" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">• Regulatory/licensing state by state</text>
    <text x="826" y="468" fill="#727579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">• Delivery partner concentration</text>
    <rect x="826" y="520" width="300" height="46" rx="23" fill="#9caafa" opacity="0.9"/>
    <text x="856" y="549" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="850">AI-assisted · founder reviewed</text>
  </g>

  <text x="354" y="720" fill="#24272b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">Standardization can become useful before the full investor marketplace is liquid.</text>
</svg>
