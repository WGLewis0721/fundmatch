name: Deploy FundMatch App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundmatch-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Cloudflare credentials
        id: cloudflare-auth
        env:
          PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PRIMARY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEGACY_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TOKEN="${PRIMARY_TOKEN:-${LEGACY_TOKEN:-}}"
          ACCOUNT_ID="${PRIMARY_ACCOUNT_ID:-${LEGACY_ACCOUNT_ID:-}}"

          if [ -z "$TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare production deployment skipped because no repository Cloudflare API token is configured. GitHub Pages and CI are unaffected."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          if [ -n "$ACCOUNT_ID" ]; then
            echo "::add-mask::$ACCOUNT_ID"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Cloudflare deployment not configured
        if: steps.cloudflare-auth.outputs.available != 'true'
        run: |
          echo "Cloudflare production deploy is intentionally skipped until CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) is configured."
          echo "This is not a code/build failure."

      - uses: actions/checkout@v4
        if: steps.cloudflare-auth.outputs.available == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.cloudflare-auth.outputs.available == 'true'

      - name: Install dependencies
        if: steps.cloudflare-auth.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Build authenticated app
        if: steps.cloudflare-auth.outputs.available == 'true'
        env:
          VITE_SUPABASE_URL: https://dkanoobzseckccbwnpyi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1UFQzS1rNIyeM80T7p6f-A_kTJIc6AW
        run: bun run build

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare-auth.outputs.available == 'true'
        run: npx wrangler deploy
